<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>选择交通方式 - UI原型</title>
    <link rel="stylesheet" href="ui-octopus.css">
    <style>
        /* 页面补充：把设计系统中的 .tr-t/.tr-s 泛化，供 .field / .search-box 复用 */
        .tr-t { font-size: 12.5px; font-weight: 700; color: var(--ink); }
        .tr-s { font-size: 10px; color: var(--ink-2); margin-top: 3px; }
        .mode-item small { font-size: 9px; color: var(--ink-3); margin-top: 5px; white-space: nowrap; }
        .mode-item.on small { color: var(--purple-ink); font-weight: 700; }
        .trip-row[data-pick] { cursor: pointer; }
        .tr-c.mid .tag { margin-top: 5px; }
    </style>
</head>
<body>
<div class="wrap">

    <!-- 设计稿标注：蓝色粗体标题 -->
    <div class="screen-label">交通 · 选择交通方式 <small>ui-transport-select.html</small></div>

    <div class="phone">
        <!-- 手机状态栏 -->
        <div class="statusbar">
            <span>9:41</span>
            <span class="sb-r">📶 ▮▮▮ 🔋</span>
        </div>

        <!-- 返回 ‹ / 居中标题 / 右上操作 -->
        <div class="app-bar">
            <a class="bk" href="ui-trip-create.html" title="返回">‹</a>
            <div class="tt">选择交通方式</div>
            <span class="ac hl" onclick="resetSelection()">重置</span>
        </div>

        <div class="phone-body">
            <!-- 灰色圆角搜索/输入框 -->
            <div class="search-box">🔍 <span class="muted">北京 ⟶ 上海</span></div>
            <div class="section-hint">选择出行方式，查看具体班次</div>

            <!-- 5 个圆形交通方式图标，紫色实心圆为选中 -->
            <div class="mode-row" id="modeRow">
                <div class="mode-item on" data-mode="airplane" onclick="setMode('airplane')">
                    <div class="mode-ic on">✈️</div><small>飞机</small>
                </div>
                <div class="mode-item" data-mode="highspeed" onclick="setMode('highspeed')">
                    <div class="mode-ic">🚄</div><small>高铁</small>
                </div>
                <div class="mode-item" data-mode="train" onclick="setMode('train')">
                    <div class="mode-ic">🚃</div><small>火车</small>
                </div>
                <div class="mode-item" data-mode="bus" onclick="setMode('bus')">
                    <div class="mode-ic">🚌</div><small>汽车</small>
                </div>
                <div class="mode-item" data-mode="drive" onclick="setMode('drive')">
                    <div class="mode-ic">🚗</div><small>自驾</small>
                </div>
            </div>

            <!-- 下面一行小标签：当前方式 + 真实时长 -->
            <div class="section-hint" id="modeHint">飞机 · 约2h30m</div>
            <div class="divider"></div>

            <!-- 交通枢纽（仅飞机有真实数据，其余方式显示「暂无数据」） -->
            <div id="hubBlock"></div>

            <!-- 已选状态 -->
            <div class="list-row on" id="selectedRow">
                <div class="lr-thumb">✓</div>
                <div class="lr-t" id="selectedText" style="min-width:0">已选: 飞机 · 经济舱</div>
                <div class="radio">✓</div>
            </div>

            <!-- 班次列表：三列信息 + 中间紫色胶囊标签 -->
            <div class="trip-list">
                <div class="section-hint" id="listTitle">可选航班 (北京 → 上海)</div>
                <div id="tripRows"></div>
            </div>

            <div class="btn-row">
                <a class="btn btn-ghost btn-block" href="ui-trip-preview.html">查看行程预览</a>
            </div>
        </div>

        <!-- 底部确认 -->
        <div class="bottom-bar">
            <button class="btn btn-primary btn-block" type="button" onclick="confirmSelection()">确认选择</button>
        </div>
    </div>

    <!-- 原型页间导航 -->
    <div class="nav-links">
        <a href="ui-index.html">总览</a>
        <a href="ui-trip-create.html">创建行程</a>
        <a href="ui-trip-preview.html">行程详情</a>
        <a href="ui-page-p06-photos.html">照片管理</a>
        <a href="ui-transport-select.html">选择交通方式</a>
        <a href="ui-transport-mode.html">出行方式</a>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    "use strict";

    /* 全部数据来自原 ui-transport-select.html，未新增任何班次号 / 价格 / 时刻 / 城市 */
    var MODES = [
        { key: "airplane",  name: "飞机", dur: "约2h30m" },
        { key: "highspeed", name: "高铁", dur: "约4h30m" },
        { key: "train",     name: "火车", dur: "约9h" },
        { key: "bus",       name: "汽车", dur: "约12h" },
        { key: "drive",     name: "自驾", dur: "约12h" }
    ];

    var FLIGHTS = [
        { no: "CA1515", cabin: "经济舱", dep: "08:00", arr: "10:30", from: "PEK", to: "PVG", duration: "2h30m", price: "¥680", seats: "余票充足" },
        { no: "MU5184", cabin: "经济舱", dep: "10:00", arr: "12:30", from: "PEK", to: "PVG", duration: "2h30m", price: "¥650", seats: "余票充足" },
        { no: "CZ3901", cabin: "经济舱", dep: "14:00", arr: "16:30", from: "PEK", to: "PVG", duration: "2h30m", price: "¥620", seats: "余5张" },
        { no: "HU7607", cabin: "经济舱", dep: "18:30", arr: "21:00", from: "PEK", to: "PVG", duration: "2h30m", price: "¥590", seats: "余票充足" }
    ];

    var HUBS = [
        { name: "北京首都国际机场 T3", meta: "出发地 · 起飞", time: "08:00" },
        { name: "上海浦东国际机场",   meta: "目的地 · 到达", time: "10:30" }
    ];

    var currentMode = "airplane";
    var selectedIndex = 0;
    var toastTimer = null;

    /** 底部轻量提示，替代原生 alert。 */
    function showToast(msg) {
        var el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        if (toastTimer !== null) { clearTimeout(toastTimer); }
        toastTimer = setTimeout(function () {
            el.classList.remove("show");
            toastTimer = null;
        }, 1800);
    }

    /** 交通枢纽块：仅「飞机」有原页真实枢纽数据。 */
    function buildHubHTML() {
        if (currentMode !== "airplane") {
            return '<div class="section-hint muted">暂无数据</div>';
        }
        var html = '<div class="section-hint">选择航班后将自动添加以下交通枢纽（不可修改）</div>';
        for (var i = 0; i < HUBS.length; i++) {
            var h = HUBS[i];
            html += '<div class="field">' +
                        '<span style="font-size:18px">✈️</span>' +
                        '<div style="flex:1;min-width:0">' +
                            '<div class="tr-t">' + h.name + '</div>' +
                            '<div class="tr-s">' + h.meta + '</div>' +
                        '</div>' +
                        '<b class="muted">' + h.time + '</b>' +
                    '</div>';
        }
        return html;
    }

    /** 单个航班行：左=航班号/舱位，中=时刻/机场+紫色胶囊，右=价格/余票。 */
    function buildFlightHTML(f, i) {
        return '<div class="trip-row' + (i === selectedIndex ? ' on' : '') + '" data-pick="1" data-index="' + i + '" onclick="selectFlight(' + i + ')">' +
                    '<div class="tr-c">' +
                        '<div class="tr-t">' + f.no + '</div>' +
                        '<div class="tr-s">' + f.cabin + '</div>' +
                    '</div>' +
                    '<div class="tr-c mid">' +
                        '<div class="tr-t">' + f.dep + ' → ' + f.arr + '</div>' +
                        '<div class="tr-s">' + f.from + ' → ' + f.to + '</div>' +
                        '<span class="tag purple">' + f.duration + '</span>' +
                    '</div>' +
                    '<div class="tr-c right">' +
                        '<div class="tr-price">' + f.price + '</div>' +
                        '<div class="tr-s">' + f.seats + '</div>' +
                    '</div>' +
                '</div>';
    }

    /** 依据当前方式重绘图标、说明、枢纽与班次列表。 */
    function render() {
        var mode = MODES[0];
        for (var m = 0; m < MODES.length; m++) {
            if (MODES[m].key === currentMode) { mode = MODES[m]; }
        }

        var items = document.querySelectorAll("#modeRow .mode-item");
        for (var k = 0; k < items.length; k++) {
            var on = (items[k].getAttribute("data-mode") === currentMode);
            items[k].classList.toggle("on", on);
            items[k].querySelector(".mode-ic").classList.toggle("on", on);
        }

        document.getElementById("modeHint").textContent = mode.name + " · " + mode.dur;
        document.getElementById("selectedText").textContent =
            (currentMode === "airplane") ? "已选: 飞机 · 经济舱" : "已选: " + mode.name;
        document.getElementById("hubBlock").innerHTML = buildHubHTML();

        var title = document.getElementById("listTitle");
        var rows = document.getElementById("tripRows");
        if (currentMode === "airplane") {
            title.textContent = "可选航班 (北京 → 上海)";
            var html = "";
            for (var i = 0; i < FLIGHTS.length; i++) {
                html += buildFlightHTML(FLIGHTS[i], i);
            }
            rows.innerHTML = html;
        } else {
            /* 原页面仅提供航班数据，其余方式不编造车次 */
            title.textContent = "可选班次 (北京 → 上海)";
            rows.innerHTML = '<div class="trip-row">' +
                                '<div class="tr-c">' +
                                    '<div class="tr-t muted">暂无班次数据</div>' +
                                    '<div class="tr-s">暂无数据</div>' +
                                '</div>' +
                             '</div>';
        }
    }

    /** 切换 5 个圆形方式图标。 */
    function setMode(key) {
        currentMode = key;
        render();
        var label = key;
        for (var i = 0; i < MODES.length; i++) {
            if (MODES[i].key === key) { label = MODES[i].name; }
        }
        showToast("已切换到 " + label);
    }

    /** 选中某一行车次：浅紫底 + 左侧紫色竖条（.trip-row.on）。 */
    function selectFlight(index) {
        selectedIndex = index;
        var rows = document.querySelectorAll("#tripRows .trip-row");
        for (var i = 0; i < rows.length; i++) {
            rows[i].classList.toggle("on", i === index);
        }
        var f = FLIGHTS[index];
        document.getElementById("selectedText").textContent = "已选: 飞机 · 经济舱 · " + f.no;
        showToast("已选 " + f.no + " · " + f.price);
    }

    /** 右上「重置」：回到原页面初始状态。 */
    function resetSelection() {
        currentMode = "airplane";
        selectedIndex = 0;
        render();
        showToast("已重置为 飞机 · 经济舱");
    }

    /** 底部确认：toast 反馈后跳转行程预览。 */
    function confirmSelection() {
        if (currentMode !== "airplane" || selectedIndex === null) {
            showToast("暂无班次数据，请先选择航班");
            return;
        }
        var f = FLIGHTS[selectedIndex];
        showToast("已确认 " + f.no + " · " + f.price + "，前往行程预览");
        setTimeout(function () {
            window.location.href = "ui-trip-preview.html";
        }, 1200);
    }

    render();
</script>
</body>
</html>
