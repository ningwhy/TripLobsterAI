name: trip_planner
description: 旅行行程创建助手
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # 高德地图 Web API
  http: ^1.2.0
  image_picker: ^1.0.7
  photo_manager: ^3.0.0
  intl: ^0.18.1
  uuid: ^4.2.2
  url_launcher: ^6.2.4
  flutter_map: ^7.0.2
  share_plus: ^10.0.2
  path_provider: ^2.1.4
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
